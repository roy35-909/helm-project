apiVersion: v1
kind: Namespace
metadata:
  name: "db-{{ .Values.namespace }}"

---

# kubectl create secrets generic postgres-secret --from-env-file=postgres.env

apiVersion: v1
kind: Service
metadata:
  namespace: "db-{{ .Values.namespace }}"
  name: "{{ .Values.namespace }}-db-headless"

spec:
  clusterIP: None
  selector:
    app: "{{ .Values.app.name }}"

  ports:
  - port: 5432 

---

apiVersion: v1
kind: Service 
metadata:
  namespace: "db-{{ .Values.namespace }}" 
  name: "postgres-{{ .Values.namespace }}"

spec:
  selector:
    app: "{{ .Values.app.name }}" 

  ports:
  - port: 5432

---

apiVersion: apps/v1
kind: StatefulSet
metadata:
  namespace: "db-{{ .Values.namespace }}" 
  name: "{{ .Values.app.name }}"

spec:
  serviceName: "{{ .Values.namespace }}-db-headless"
  replicas: {{ .Values.app.replicas }}
  selector:
    matchLabels:
      app: "{{ .Values.app.name }}" 

  template:
    metadata:
      labels:
        app: "{{ .Values.app.name }}"
    spec:
      containers:
      - name: "{{ .Values.app.name }}"
        image: "{{ .Values.app.image }}"
        ports:
        - containerPort: 5432

        envFrom:
        - secretRef:
            name: "{{ .Values.app.secretName }}" 
        env:
        - name: PGDATA
          value: /var/lib/postgresql/data/pgdata

        volumeMounts:
        - name: data
          mountPath: /var/lib/postgresql/data 

        resources:
          requests:
            cpu: "{{ .Values.app.request.cpu }}"
            memory: "{{ .Values.app.request.memory }}"
          limits:
            memory: "{{ .Values.app.limits.memory }}"

        readinessProbe:
          exec:
            command: ["sh", "-c", "pg_isready -U $POSTGRES_USER -d $POSTGRES_DB"]
          initialDelaySeconds: 5
          periodSeconds: 10

        livenessProbe:
          exec:
            command: ["sh", "-c", "pg_isready -U $POSTGRES_USER -d $POSTGRES_DB"]
          initialDelaySeconds: 30
          periodSeconds: 20


  volumeClaimTemplates:
  - metadata:
      name: data
    spec:
      accessModes: ["ReadWriteOnce"]
      resources:
        requests:
          storage: "{{ .Values.app.volumeClaimTemplates.storage }}"